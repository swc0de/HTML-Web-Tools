<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator · swcode</title>
<meta name="description" content="Generate strong random passwords in your browser.">
<meta name="theme-color" content="#0c0e11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e11;--surface:#13161a;--field:#0f1216;--border:#22272e;--border-2:#2d343c;
    --text:#e6e9ed;--muted:#8b939e;--dim:#5c6570;--radius:12px;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .wrap{width:min(1120px,100% - 32px);margin-inline:auto}
  header.top{border-bottom:1px solid var(--border)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .crumb{display:flex;align-items:center;gap:10px;font-size:15px}
  .crumb .brand{font-weight:700;font-size:20px;letter-spacing:-.02em}
  .crumb .sep{color:var(--dim)}
  .crumb .here{color:var(--muted)}
  .gh{display:flex;align-items:center;color:var(--muted)}
  .gh:hover{color:var(--text)}
  .gh svg{width:22px;height:22px;fill:currentColor}
  main{flex:1;padding:48px 0}
  .card{max-width:480px;margin-inline:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px}
  h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .divider{height:1px;background:var(--border);margin:22px 0}
  .output{
    background:var(--field);border:1px solid var(--border);border-radius:10px;min-height:64px;padding:16px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:var(--mono);font-weight:500;font-size:18px;word-break:break-all;line-height:1.35;user-select:all
  }
  .len-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:24px;font-size:14px}
  .len-row output{font-family:var(--mono);font-weight:700}
  input[type=range]{width:100%;margin-top:10px;accent-color:#9aa7b3}
  .opts{margin-top:20px;display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
  .opt input{width:17px;height:17px;accent-color:#9aa7b3;cursor:pointer}
  .opt.fixed{color:var(--dim);cursor:default}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
  .btn{font:inherit;font-size:14px;font-weight:600;padding:12px 18px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .btn.primary{background:var(--text);color:var(--bg)}
  .btn.primary:hover{background:#fff}
  .btn.secondary{background:transparent;color:var(--text);border-color:var(--border-2)}
  .btn.secondary:hover{border-color:#46505c}
  .status{font-size:12.5px;color:var(--dim);text-align:center;margin-top:14px;min-height:19px}
  footer{border-top:1px solid var(--border);padding:24px 0 36px;color:var(--dim);font-size:13px}
  footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
  footer a{color:var(--muted)} footer a:hover{color:var(--text)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="crumb"><a class="brand" href="index.html">swcode</a><span class="sep">/</span><span class="here">Password Generator</span></div>
    <a class="gh" href="https://github.com/swc0de" target="_blank" rel="noopener" aria-label="swc0de on GitHub" title="GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h1>Password Generator</h1>
    <p class="sub">Strong random passwords, generated entirely in your browser.</p>
    <div class="divider"></div>

    <div class="output" id="out" aria-live="polite"></div>

    <div class="len-row"><label for="len">Length</label><output id="lenVal">16</output></div>
    <input type="range" id="len" min="4" max="40" value="16">

    <div class="opts">
      <label class="opt fixed"><input type="checkbox" checked disabled> Lowercase letters (a-z)</label>
      <label class="opt"><input type="checkbox" id="upper" checked> Capital letters (A-Z)</label>
      <label class="opt"><input type="checkbox" id="nums" checked> Numbers (0-9)</label>
      <label class="opt"><input type="checkbox" id="special" checked> Special characters (!@#...)</label>
    </div>

    <div class="btns">
      <button class="btn primary" id="gen" type="button">Generate</button>
      <button class="btn secondary" id="copy" type="button">Copy</button>
    </div>
    <p class="status" id="status"></p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 swcode</span>
    <span><a href="index.html">Home</a> &nbsp;·&nbsp; <a href="https://github.com/swc0de" target="_blank" rel="noopener">GitHub</a></span>
  </div>
</footer>

<script>
  // Secure random integer in [0, n) using crypto.getRandomValues (rejection sampling, no bias).
  function randInt(n){
    const max = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= max);
    return buf[0] % n;
  }
  const pick = s => s[randInt(s.length)];

  const LOWER = 'abcdefghijklmnopqrstuvwxyz';
  const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const DIGITS = '0123456789';
  const SPECIAL = '!@#$%^&*()-_=+[]{};:,.<>?';

  const $ = id => document.getElementById(id);
  const out = $('out'), status = $('status'), len = $('len');

  function generate(){
    const length = parseInt(len.value, 10);
    // Lowercase is always included; add the other chosen pools.
    const pools = [LOWER];
    if ($('upper').checked) pools.push(UPPER);
    if ($('nums').checked) pools.push(DIGITS);
    if ($('special').checked) pools.push(SPECIAL);

    // At least one character from each chosen pool, the rest from the combined pool.
    const combined = pools.join('');
    let chars = pools.map(pick);
    while (chars.length < length) chars.push(pick(combined));
    chars = chars.slice(0, length);

    // Fisher–Yates shuffle so the guaranteed characters aren't always first.
    for (let i = chars.length - 1; i > 0; i--){
      const j = randInt(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    out.textContent = chars.join('');
    status.textContent = '';
  }

  len.addEventListener('input', () => { $('lenVal').textContent = len.value; generate(); });
  ['upper','nums','special'].forEach(id => $(id).addEventListener('change', generate));
  $('gen').addEventListener('click', generate);
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(out.textContent); status.textContent = 'Copied to clipboard'; }
    catch { status.textContent = 'Copy failed — select and copy manually'; }
  });

  generate(); // start with one ready to go
</script>
</body>
</html>
